# =============================================================================
# platform_team_values.yaml — Central Configuration for Platform Team Automation
# =============================================================================
# This file is the single source of truth for everything the platform-team-admin
# Pulumi program manages: GitHub repositories and organization membership.
#
# Usage:
#   Edit this file to add repositories or team members, then run:
#     pulumi up
#   in the project root to apply changes.
#
# Referenced by: pulumi_repo_create.py / __main__.py
# =============================================================================

# ── GitHub Repositories ────────────────────────────────────────────────────────
# Each entry creates a GitHub repository in your organization.
# Supported fields:
#   name        (required) Repository name — use kebab-case
#   description (optional) Short description shown on GitHub
#   visibility  (optional) "private" | "public" | "internal"  [default: private]
# ------------------------------------------------------------------------------
github_repositories:

  # Platform team administration — manages membership, access, and artifacts
  - name: platform-team-admin
    description: >
      Repository to manage platform team membership, admin artifacts,
      and organization-level automation.
    visibility: public

  # Core platform runtime — Pulumi IaC for cluster, networking, service mesh
  - name: platform-core
    description: >
      Core platform runtime: Kubernetes cluster provisioning, network
      configuration, and service mesh setup.
    visibility: public

  # Demo application — used throughout the book to validate platform capabilities
  - name: platform-demo-apps
    description: >
      Demo application for testing and validating platform capabilities.
      Deployed as part of Chapter 5 user experience evaluation.
    visibility: public

  # Platform extensions — plugins, custom integrations, and add-ons
  - name: platform-extensions
    description: >
      Platform extensions: plugins, custom integrations, and add-ons
      that extend the core platform without modifying it directly.
    visibility: public

  # GitOps coordination hub — Argo CD's "App of Apps" root: a catalog of
  # pointers to team/service repos, not application manifests itself.
  - name: platform-gitops
    description: >
      GitOps coordination hub for Argo CD's App of Apps pattern — declares
      which repositories/paths Argo CD should watch and deploy.
    visibility: public

  # Platform services and extensions — the actual Helm-deployed workloads
  # (service mesh, databases, etc.) that platform-gitops' Application CRDs
  # point at. Structured base + per-environment Kustomize overlays.
  - name: platform-services
    description: >
      Platform services and extensions deployed via Helm/Kustomize —
      service mesh, shared runtime services, and cluster-behavior
      extensions — referenced by platform-gitops.
    visibility: public

  # Beginner-to-intermediate guide to this platform — a standalone book, not
  # a repo's own docs. Sits alongside every other repo's learning/ and docs/
  # trees rather than replacing them; reads as one continuous story across
  # all four (eventually six) repos instead of being organized repo-by-repo.
  - name: platform-guide
    description: >
      A beginner-to-intermediate guide to this platform, written as one
      continuous book — concepts, analogies, and hands-on practice woven
      together across all four repos.
    visibility: public

  # Add new repositories below this line as the platform grows.
  # Example:
  # - name: platform-observability
  #   description: Observability stack — Prometheus, Grafana, OTEL Collector
  #   visibility: public


# ── Branch Protection ─────────────────────────────────────────────────────────
# Applies to the "main" branch of every repository above.
# required_approving_review_count: 0 while solo-maintaining with a single
# GitHub account (self-approval isn't allowed and enforce_admins blocks
# bypassing it). Raise back to 1+ once a second reviewer/collaborator exists.
# ------------------------------------------------------------------------------
branch_protection:
  required_approving_review_count: 0


# ── GitHub Organization Members ───────────────────────────────────────────────
# Each entry adds (or updates) a member in your GitHub organization.
# Supported fields:
#   name          Display name (informational only — not sent to GitHub)
#   github-role   "admin" | "member"
#   github-username  The member's GitHub username (must already have a GitHub account)
#   email         For documentation/audit purposes; not used by the API
#
# Note: You cannot automate management of the organization owner account.
# Create a separate GitHub account to test team member onboarding.
# ------------------------------------------------------------------------------
